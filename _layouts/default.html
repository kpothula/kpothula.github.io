<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" media="screen">
    <link rel="stylesheet" href="{{ '/assets/css/print.css' | relative_url }}" media="print">
    {% seo %}
    {% include head-custom.html %}
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
        <p class="site-tagline">{{ site.description }}</p>
        {% include site-nav.html %}
      </div>
    </header>

    <main class="site-main">
      <article class="content">
        {{ content }}
      </article>
    </main>

    <footer class="site-footer">
      <div class="site-footer-inner">
        <a href="{{ '/' | relative_url }}">{{ site.title }}</a> · <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </div>
    </footer>
  </body>
</html>
